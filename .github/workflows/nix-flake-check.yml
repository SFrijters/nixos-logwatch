name: "nix flake check"
on:
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  push:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Flake metadata
      run: |
        nix flake metadata
        nix flake show

    - name: Flake check
      run: |
        nix flake check -L

    - name: Run logwatch
      run: |
        nix run . -- --version

    - name: Build from overlay without flake
      run: |
        for p in logwatch logwatch-scripts.passthrough logwatch-scripts.nix-gc logwatch-scripts.nixos-upgrade; do
          NIX_PATH=$NIX_PATH:nixpkgs-overlays=$(pwd)/overlays.nix \
          nix-build \
            https://github.com/NixOS/nixpkgs/archive/$(grep rev flake.lock | sed 's/^.*: //' | sed -e 's/"//g' -e 's/,//').tar.gz \
            --attr ${p}
        done

    - name: Formatter check
      run: |
        nix fmt
        git diff --exit-code
